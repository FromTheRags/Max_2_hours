name: Build & Package (SDL 3)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-linux:
    name: Linux (Ubuntu - SDL 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(head -n1 VERSION | tr -d '\r ')"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Setup SDL3 & SDL3_ttf
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          version-sdl-ttf: 3-latest
          install-linux-dependencies: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$APP_VERSION" -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build project
        run: cmake --build build --config Release

      - name: Package Linux Artifact
        run: |
          mkdir -p dist/max_2_hours-sdl3-linux/lib
          cp build/max_2_hours dist/max_2_hours-sdl3-linux/
          cp -r assets dist/max_2_hours-sdl3-linux/
          cp assets/*.bmp assets/*.ttf dist/max_2_hours-sdl3-linux/ || true
          cp LICENSE LICENSES.md OFL.txt README.md dist/max_2_hours-sdl3-linux/
          # Copy bundled SDL3 and SDL3_ttf shared libraries (and symlinks) into package
          cp -d "${{ steps.sdl.outputs.prefix }}"/lib/libSDL3*.so* dist/max_2_hours-sdl3-linux/lib/ 2>/dev/null || true
          cp -d "${{ steps.sdl.outputs.prefix }}"/lib/libSDL3*.so* dist/max_2_hours-sdl3-linux/ 2>/dev/null || true
          # Create launcher script
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LD_LIBRARY_PATH="$DIR:$DIR/lib:$LD_LIBRARY_PATH"\nexec "$DIR/max_2_hours" "$@"\n' > dist/max_2_hours-sdl3-linux/max_2_hours.sh
          chmod +x dist/max_2_hours-sdl3-linux/max_2_hours.sh dist/max_2_hours-sdl3-linux/max_2_hours
          cd dist && tar -czvf ../max_2_hours-sdl3-linux-x86_64.tar.gz max_2_hours-sdl3-linux

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: max_2_hours-sdl3-linux-x86_64
          path: max_2_hours-sdl3-linux-x86_64.tar.gz

  build-windows:
    name: Windows (MinGW-w64 - SDL 3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(head -n1 VERSION | tr -d '\r ')"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-ttf

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$APP_VERSION"

      - name: Build project
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package Windows Portable Zip
        shell: msys2 {0}
        run: |
          mkdir -p dist/max_2_hours-sdl3-windows
          cp build/max_2_hours.exe dist/max_2_hours-sdl3-windows/
          cp -r assets dist/max_2_hours-sdl3-windows/
          cp assets/*.bmp assets/*.ttf dist/max_2_hours-sdl3-windows/ || true
          cp LICENSE LICENSES.md OFL.txt README.md dist/max_2_hours-sdl3-windows/
          cp build/*.dll dist/max_2_hours-sdl3-windows/ 2>/dev/null || true
          cmake -DEXECUTABLE="$PWD/build/max_2_hours.exe" -DDESTINATION="$PWD/dist/max_2_hours-sdl3-windows" -DMINGW_BIN_DIR=/mingw64/bin -P cmake/CopyRuntimeDependencies.cmake
          cd dist && cmake -E tar cf ../max_2_hours-sdl3-windows-x64.zip --format=zip max_2_hours-sdl3-windows

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: max_2_hours-sdl3-windows-x64
          path: max_2_hours-sdl3-windows-x64.zip

      - name: Build Inno Setup installer (no admin rights required)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSdlLabel=SDL 3" `
            "/DSourceDir=$PWD\dist\max_2_hours-sdl3-windows" "/DOutputDir=$PWD" `
            "/DOutputBaseName=max_2_hours-sdl3-setup-x64" installer\max_2_hours.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: max_2_hours-sdl3-setup-x64
          path: max_2_hours-sdl3-setup-x64.exe

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
